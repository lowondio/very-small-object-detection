[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "small-obj-det"
version = "0.1.0"
description = "Small flying object detection research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "pyyaml",
  "tqdm",
  "requests",
  "pillow",
  "gdown",
  "ultralytics",
]

[project.scripts]
sfod = "sfod.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
